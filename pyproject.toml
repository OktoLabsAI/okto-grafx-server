[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-grafx-server"
version = "0.1.0"
description = "Server daemon and web administration console for the Okto Grafx embedded graph database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic License 2.0 + SaaS/Branding Addendum" }
authors = [{ name = "Okto Labs" }]
keywords = ["graph-database", "server", "okto-grafx", "admin-ui", "mcp"]
dependencies = [
    "okto-grafx>=0.0.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # The WebSocket write session runs on uvicorn's `ws="websockets"` protocol, and this daemon answers
    # /api and /admin/api through Starlette types directly — both are imported by name, so both are
    # declared rather than borrowed from whatever FastAPI happened to pull in.
    "websockets>=12",
    "starlette>=0.37",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # `addopts` below passes --timeout, so the plugin is not optional for running the suite.
    "pytest-timeout>=2.2",
    "httpx>=0.27",
    "psutil>=5.9",
    "ruff>=0.6",
]

[project.scripts]
oktografx-server = "okto_grafx_server.cli:main"

[project.urls]
Homepage = "https://github.com/OktoLabsAI/okto-grafx-server"
Repository = "https://github.com/OktoLabsAI/okto-grafx-server"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["okto_grafx_server", "okto_grafx_server.*"]

[tool.setuptools.package-data]
okto_grafx_server = ["web/**/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --timeout=120"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
