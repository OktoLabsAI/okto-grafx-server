name: ci

# The same gate a contributor runs locally. Split so a console typo does not cost three minutes of
# engine time, and so the browser half — the slow one — can fail with its own artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Tests
        # The suite opens real stores: run it with the project interpreter, in a temp dir per test.
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.xml
          if-no-files-found: ignore

  console:
    name: console (vitest + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Tests
        run: npx vitest run
        working-directory: web
      - name: Types
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: web
      - name: Build
        # The build output is committed on purpose (a wheel ships the console), so this proves the
        # committed artifact still matches the source.
        run: npm run build
        working-directory: web
      - name: The committed console is up to date
        run: git diff --exit-code -- src/okto_grafx_server/web || {
                 echo "::error::src/okto_grafx_server/web is stale — run (cd web && npm run build) and commit.";
                 git status --porcelain -- src/okto_grafx_server/web | head; exit 1; }

  installer:
    name: installer (${{ matrix.os }}, ${{ matrix.installer }})
    # install.sh is a product surface: it is the first thing most people run, it is usually piped
    # straight into a shell, and it has to work on the bash macOS ships, not only the one a developer
    # installed. install.ps1 makes the same promises to the machines that have no bash at all, and this
    # job is the only place any of that PowerShell is ever executed — a .ps1 cannot be run on the macOS
    # or Linux box a developer is holding, so "it parses" is not something anyone can check by hand.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            installer: pip
          - os: macos-latest
            installer: uv
          - os: windows-latest
            installer: pip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: uv is on the path we test it on
        # macOS runners do not necessarily ship uv, and this matrix entry exists to test the uv path.
        # Installing into the setup-python interpreter puts it on PATH where python3 already is.
        if: runner.os != 'Windows'
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv --version
          else
            python3 -m pip install --quiet uv
            uv --version
          fi
      - name: install, init, start, attach a store, query it, uninstall
        if: runner.os != 'Windows'
        env:
          OKGIT_SOURCE: --from-tree ${{ github.workspace }}
          OKGIT_INSTALLER: ${{ matrix.installer }}
          OKGIT_PYTHON: python3
          OKGIT_PORT: "8791"
        run: ./scripts/test-installer.sh
      - name: install, init, start, attach a store, query it, uninstall (PowerShell)
        # Driven by the in-box Windows PowerShell, not by pwsh 7 from the runner image: the one-liner in
        # the README runs on a machine where nothing has been installed yet, and that is 5.1.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OKGIT_SOURCE: -FromTree ${{ github.workspace }}
          OKGIT_INSTALLER: ${{ matrix.installer }}
          OKGIT_PYTHON: python
          OKGIT_PORT: "8791"
        run: ./scripts/test-installer.ps1

  gate:
    name: acceptance gate (no browser)
    needs: [backend, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: REST, WebSocket, MCP, OpenAPI, metrics, SPA, audit, README examples
        env:
          PORT: "8899"
          WITH_BROWSER: "0"
          # There is no .venv on a runner: the gate runs on the interpreter setup-python provided.
          PYTHON: python3
        run: ./scripts/acceptance.sh

  browser:
    name: acceptance gate (console in Chromium)
    needs: [backend, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
        working-directory: web
      - name: Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Console flow, plus the transport gate
        env:
          PORT: "8900"
          WITH_README: "0"
          PYTHON: python3
        run: ./scripts/acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: /tmp/okg-acceptance.*/shots
          if-no-files-found: ignore
